<body>
<header class="site-header">
  <a class="logo" href="index.html" aria-label="FAHMI OMER">FAHMI<span>.</span></a>
  <nav class="main-nav" id="mainNav" aria-label="التنقل الرئيسي">
    <a data-i18n="nav.home" href="index.html">الرئيسية</a>
    <a data-i18n="nav.about" href="about.html">من أنا</a>
    <a data-i18n="nav.work" href="portfolio.html">أعمالي</a>

    <a data-i18n="nav.contact" href="contact.html">تواصل</a>
  </nav>
  <div class="header-tools">
    <div class="lang">
      <button class="icon-btn" id="langBtn" type="button" aria-expanded="false" aria-label="اختيار اللغة">AR⌄</button>
      <div class="lang-menu" id="langMenu">
        <button data-lang="ar" type="button">العربية</button>
        <button data-lang="en" type="button">English</button>
        <button data-lang="zh" type="button">中文</button>
        <button data-lang="es" type="button">Español</button>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="تبديل الوضع الليلي والفاتح">
      <span class="theme-icon">☾</span>
    </button>
    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-label="فتح القائمة">☰</button>
  </div>
</header>
<main>
<section class="contact-page reveal">
  <p class="eyebrow">LET'S CREATE SOMETHING GREAT</p>
  <h1 data-i18n="contact.title">لديك فكرة؟<br><em>لنجعلها واقعًا.</em></h1>
  <div class="contact-grid">
    <div>
      <p class="muted" data-i18n="contact.text">أرسل تفاصيل مشروعك وسأتواصل معك لمناقشة الفكرة والخطوات القادمة.</p>
      <a class="contact-mail" href="mailto:fahmi@example.com">fahmi@example.com ↗</a>
      <div class="socials">
        <a data-social="instagram" href="https://www.instagram.com/f.om_202" rel="noopener noreferrer" target="_blank">Instagram</a>
        <a data-social="behance" href="#" rel="noopener noreferrer" target="_blank">Behance</a>
        <a data-social="facebook" href="#" rel="noopener noreferrer" target="_blank">Facebook</a>
        <a data-social="whatsapp" href="#" rel="noopener noreferrer" target="_blank">WhatsApp</a>
      </div>
    </div>
    <form id="contactForm">
      <input name="name" required data-i18n-placeholder="contact.name" placeholder="الاسم">
      <input name="email" required type="email" data-i18n-placeholder="contact.email" placeholder="البريد الإلكتروني">
      <input name="subject" required data-i18n-placeholder="contact.subject" placeholder="موضوع المشروع">
      <textarea name="message" required data-i18n-placeholder="contact.message" placeholder="اكتب رسالتك"></textarea>
      <button class="btn gold" data-i18n="contact.send" type="submit">إرسال الرسالة ↗</button>
      <p class="form-status" id="formStatus" role="status"></p>
    </form>
  </div>
</section></main>
<footer class="site-footer">
  <span>FAHMI OMER</span>

</footer>
<button class="back-to-top" id="backToTop" type="button" aria-label="العودة للأعلى">↑</button>

</html>
